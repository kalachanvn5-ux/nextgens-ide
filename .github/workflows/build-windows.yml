name: Build NextGens for Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      npm_config_arch: x64
      SKIP_SUBMODULE_DEPS: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install node-gyp globally
        run: npm install --global node-gyp
        shell: powershell

      - name: Set VS path for node-gyp
        run: |
          $vsPath = (& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath 2>$null)
          if (-not $vsPath) { $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" }
          Write-Host "Using VS at: $vsPath"
          echo "GYP_MSVS_OVERRIDE_PATH=$vsPath" >> $env:GITHUB_ENV
          echo "GYP_MSVS_VERSION=2022" >> $env:GITHUB_ENV
        shell: powershell

      - name: Install root node_modules
        run: npm install --ignore-scripts
        shell: powershell

      - name: Force install critical build tools
        run: |
          Push-Location build
          npm install --ignore-scripts ternary-stream gulp-merge-json glob@5 event-stream
          Pop-Location
          npm install --ignore-scripts scope-tailwind@1.0.10
        shell: powershell

      - name: Install ALL subdirectory dependencies
        run: |
          # Dynamically find every directory under extensions/ that has a package.json
          # (excluding node_modules and copilot test fixtures which have their own lockfiles)
          $excludePatterns = @('node_modules', 'copilot/test/simulation/fixtures', 'copilot/chat-lib', 'serverPlugin')
          $dirs = Get-ChildItem -Path 'extensions', 'build', 'build/rspack', 'build/vite' -Filter 'package.json' -Recurse -ErrorAction SilentlyContinue |
            Where-Object {
              $path = $_.FullName
              $skip = $false
              foreach ($pat in $excludePatterns) {
                if ($path -match [regex]::Escape($pat)) { $skip = $true; break }
              }
              -not $skip
            } |
            ForEach-Object { $_.DirectoryName }

          foreach ($dir in $dirs) {
            Write-Host "Installing: $dir"
            Push-Location $dir
            npm install --ignore-scripts 2>&1 | Select-Object -Last 3
            Pop-Location
          }
        shell: powershell
        continue-on-error: true

      - name: Build native modules with VS2022
        run: |
          $modules = @('@vscode/deviceid', '@parcel/watcher', '@vscode/spdlog', '@vscode/sqlite3')
          foreach ($mod in $modules) {
            $modPath = "node_modules\$mod"
            if (Test-Path $modPath) {
              Write-Host "Building $mod..."
              Push-Location $modPath
              node-gyp rebuild
              Pop-Location
            }
          }
        shell: powershell
        continue-on-error: true

      - name: Compile TypeScript
        run: npm run compile
        shell: powershell

      - name: Build React UI
        run: npm run buildreact
        shell: powershell

      - name: Package Windows installer
        run: npm run gulp vscode-win32-x64-setup
        shell: powershell

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NextGens-Windows
          path: out/
          retention-days: 7

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NextGens-Windows-Setup
          path: .build/**/*.exe
          retention-days: 7
