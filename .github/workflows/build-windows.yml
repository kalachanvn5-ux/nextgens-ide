name: Build NextGens for Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Visual Studio components
        run: |
          choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.Windows11SDK.26100 --includeRecommended" -y
        shell: powershell

      - name: Install dependencies
        run: npm install
        env:
          npm_config_msvs_version: '2022'
          npm_config_arch: x64

      - name: Build React UI
        run: npm run buildreact

      - name: Compile TypeScript
        run: npm run compile

      - name: Package Windows app
        run: npm run gulp vscode-win32-x64-archive
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NextGens-Windows
          path: |
            .build/*.zip
            out/
          retention-days: 7
