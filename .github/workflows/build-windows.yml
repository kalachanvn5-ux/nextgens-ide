name: Build NextGens for Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      npm_config_arch: x64
      SKIP_SUBMODULE_DEPS: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install node-gyp globally
        run: npm install --global node-gyp
        shell: powershell

      - name: Set VS path for node-gyp
        run: |
          $vsPath = (& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath 2>$null)
          if (-not $vsPath) { $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" }
          Write-Host "Using VS at: $vsPath"
          echo "GYP_MSVS_OVERRIDE_PATH=$vsPath" >> $env:GITHUB_ENV
          echo "GYP_MSVS_VERSION=2022" >> $env:GITHUB_ENV
        shell: powershell

      - name: Install root node_modules
        run: npm install --ignore-scripts
        shell: powershell

      - name: Force install critical build tools
        run: |
          Push-Location build
          npm install --ignore-scripts ternary-stream gulp-merge-json glob@5 event-stream
          Pop-Location
        shell: powershell

      - name: Install ALL subdirectory dependencies
        run: |
          $dirs = @(
            'build', 'build/rspack', 'build/vite',
            'extensions', 'extensions/configuration-editing', 'extensions/copilot',
            'extensions/css-language-features', 'extensions/css-language-features/server',
            'extensions/debug-auto-launch', 'extensions/debug-server-ready',
            'extensions/emmet', 'extensions/extension-editing',
            'extensions/git', 'extensions/git-base', 'extensions/github',
            'extensions/github-authentication', 'extensions/grunt', 'extensions/gulp',
            'extensions/html-language-features', 'extensions/html-language-features/server',
            'extensions/ipynb', 'extensions/jake',
            'extensions/json-language-features', 'extensions/json-language-features/server',
            'extensions/markdown-language-features', 'extensions/markdown-math',
            'extensions/media-preview', 'extensions/merge-conflict',
            'extensions/mermaid-chat-features', 'extensions/microsoft-authentication',
            'extensions/notebook-renderers', 'extensions/npm', 'extensions/open-remote-ssh',
            'extensions/php-language-features', 'extensions/references-view',
            'extensions/search-result', 'extensions/simple-browser',
            'extensions/tunnel-forwarding', 'extensions/terminal-suggest',
            'extensions/typescript-language-features',
            'extensions/vscode-api-tests', 'extensions/vscode-colorize-tests',
            'extensions/vscode-test-resolver'
          )
          foreach ($dir in $dirs) {
            $pkgJson = Join-Path $dir 'package.json'
            if (Test-Path $pkgJson) {
              Write-Host "Installing: $dir"
              Push-Location $dir
              npm install --ignore-scripts 2>&1 | Select-Object -Last 2
              Pop-Location
            }
          }
        shell: powershell
        continue-on-error: true

      - name: Build native modules with VS2022
        run: |
          $modules = @('@vscode/deviceid', '@parcel/watcher', '@vscode/spdlog', '@vscode/sqlite3')
          foreach ($mod in $modules) {
            $modPath = "node_modules\$mod"
            if (Test-Path $modPath) {
              Write-Host "Building $mod..."
              Push-Location $modPath
              node-gyp rebuild
              Pop-Location
            }
          }
        shell: powershell
        continue-on-error: true

      - name: Build React UI
        run: npm run buildreact
        shell: powershell

      - name: Compile TypeScript
        run: npm run compile
        shell: powershell

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NextGens-Windows
          path: out/
          retention-days: 7
