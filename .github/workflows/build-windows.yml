name: Build NextGens for Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      GYP_MSVS_VERSION: "2022"
      npm_config_arch: x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install node-gyp globally
        run: npm install --global node-gyp
        shell: powershell

      - name: Install dependencies (skip native scripts)
        run: npm install --ignore-scripts
        shell: powershell

      - name: Build native modules
        run: |
          $vsPath = (& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath)
          Write-Host "VS Path: $vsPath"
          $env:GYP_MSVS_OVERRIDE_PATH = $vsPath
          $modules = @('@vscode/deviceid', '@parcel/watcher', '@vscode/spdlog', '@vscode/sqlite3')
          foreach ($mod in $modules) {
            $modPath = "node_modules/$mod"
            if (Test-Path $modPath) {
              Write-Host "Building $mod..."
              Push-Location $modPath
              node-gyp rebuild
              Pop-Location
            }
          }
        shell: powershell
        continue-on-error: true

      - name: Install ternary-stream for build tools
        run: npm install ternary-stream event-stream --ignore-scripts
        shell: powershell
        continue-on-error: true

      - name: Run postinstall
        run: node build/npm/postinstall.ts
        shell: powershell
        continue-on-error: true

      - name: Build React UI
        run: npm run buildreact
        shell: powershell

      - name: Compile TypeScript
        run: npm run compile
        shell: powershell

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NextGens-Windows
          path: out/
          retention-days: 7
